spring:
  application:
    name: FlowState

  # Loads secrets from a local .env file (KEY=value lines) if one exists.
  # Checks backend/ first, then the repo root. Real environment variables still take precedence.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  # Tiger Data (Postgres + TimescaleDB). Tiger requires SSL, so DB_URL should end with ?sslmode=require
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowstate}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    # Hibernate never creates tables; all schema lives in Flyway migrations
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Tiger ships pg_buffercache views in public, so Flyway sees a non-empty schema and
    # baselines it; baselining at 0 (not the default 1) keeps V1 from being skipped
    baseline-version: 0

server:
  port: ${PORT:8086}

flowstate:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    # How often Gemini decides focus / stress / neutral
    decision-interval: 30s

  vitals:
    # presage = real webcam via presage-client, fake = generated readings, replay = recorded session
    source: ${VITALS_SOURCE:fake}
    summary-interval: 30s
    baseline-duration: 45s

  presage:
    api-key: ${SMARTSPECTRA_API_KEY:}
    executable: ${PRESAGE_EXECUTABLE:../presage-client/build/presage-client.exe}
    sdk-path: ${SMARTSPECTRA_SDK_PATH:C:/SmartSpectra}
    emit-interval-ms: 1000

  replay:
    file: classpath:recordings/demo-session.jsonl

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.pm.flowstate: DEBUG